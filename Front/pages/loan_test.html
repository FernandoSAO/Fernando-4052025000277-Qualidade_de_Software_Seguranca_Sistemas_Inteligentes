<!-- pages/loan_test.html -->
<div>
    <header class="page-header">
        <h1>Simulação de Empréstimo</h1>
    </header>
    <main class="content-page">
        <form id="credit-analysis-form" class="credit-analysis-form">
            <!-- Seção 1: Informações do Cliente -->
            <div class="form-section">
                <h3 class="section-header">Informações do Cliente</h3>
                <div class="form-grid">
                    <!-- CPF com botão de verificação -->
                    <div class="form-group" style="grid-column: span 2;">
                        <label for="client_cpf">CPF do Cliente:</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" 
                                id="client_cpf" 
                                name="client_cpf"
                                placeholder="000.000.000-00"
                                maxlength="14"
                                style="flex: 1;"
                                required>
                            <button type="button" id="check-cpf-btn" class="secondary-btn" style="white-space: nowrap;">
                                Verificar CPF
                            </button>
                        </div>
                        <small id="cpf-check-result" style="display: block; margin-top: 5px; font-size: 0.8rem;"></small>
                    </div>
                </div>
            </div>
            
            <!-- Seção 2: Informações do Empréstimo -->
            <div class="form-section">
                <h3 class="section-header">Informações do Empréstimo</h3>
                <div class="form-grid">
                    <!-- Valor do Empréstimo (loan_amnt) -->
                    <div class="form-group">
                        <label for="loan_amnt">Valor Solicitado (R$):</label>
                        <input type="text" 
                            id="loan_amnt" 
                            name="loan_amnt"
                            placeholder="R$ 0,00"
                            required>
                    </div>
                    
                    <!-- Objetivo do Empréstimo (loan_intent) - Dropdown -->
                    <div class="form-group">
                        <label for="loan_intent">Objetivo do Empréstimo:</label>
                        <select id="loan_intent" name="loan_intent" required>
                            <option value="">Selecione...</option>
                            <!-- Valores serão carregados do backend -->
                        </select>
                    </div>
                    
                    <!-- Taxa de Juros (loan_int_rate) -->
                    <div class="form-group">
                        <label for="loan_int_rate">Taxa de Juros (%):</label>
                        <input type="text" 
                            id="loan_int_rate" 
                            name="loan_int_rate"
                            placeholder="0,00%"
                            required>
                    </div>
                    
                    <!-- Percentual da Renda (loan_percent_income) -->
                    <div class="form-group">
                        <label for="loan_percent_income">Percentual da Renda Comprometido:</label>
                        <input type="text" 
                            id="loan_percent_income" 
                            name="loan_percent_income"
                            placeholder="0,00%"
                            required>
                    </div>
                    
                    <!-- Tempo de Histórico de Crédito (cb_person_cred_hist_length) -->
                    <div class="form-group">
                        <label for="cb_person_cred_hist_length">Tempo de Histórico de Crédito (anos):</label>
                        <input type="number" 
                            id="cb_person_cred_hist_length" 
                            name="cb_person_cred_hist_length"
                            placeholder="0 a 30 anos"
                            min="0"
                            max="30"
                            required>
                    </div>
                </div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="submit-btn">Analisar Crédito</button>
                <button type="reset" class="cancel-btn">Limpar</button>
            </div>
        </form>
    </main>
</div>
